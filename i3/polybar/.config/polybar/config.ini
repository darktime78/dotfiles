; Polybar (i3): the same two bars as waybar on sway.
; GENERATED by tools/make_bars.py - edit that file, not this one.
; Started by wm-bar (one top and one bottom bar per monitor).

[bar/base]
monitor = ${env:MONITOR:}
width = 100%
height = 16
background = #2f343f
foreground = #eef6eb
line-size = 0
padding = 0
module-margin = 0
font-0 = Hack Nerd Font:pixelsize=12;2
font-1 = Hack Nerd Font Propo:pixelsize=12;2
font-2 = Noto Color Emoji:scale=10;2
font-3 = Hack Nerd Font:pixelsize=15;3
enable-ipc = true
cursor-click = pointer
wm-restack = i3
override-redirect = false

[bar/top]
inherit = bar/base
bottom = false
modules-left = i3
modules-right = idle pulseaudio backlight memory disk power battery load language time tray

[bar/bottom]
inherit = bar/base
bottom = true
modules-left = fim router
modules-right = mpd speed wifi eth traffic bluetooth date

[settings]
screenchange-reload = true
pseudo-transparency = false

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-scroll = false
wrapping-scroll = false
ws-icon-0 = 1; 
ws-icon-1 = 2; 
ws-icon-2 = 3; 
ws-icon-3 = 4; 
ws-icon-4 = 5; 
ws-icon-5 = 6; 
ws-icon-6 = 7; 
ws-icon-7 = 8; 
ws-icon-8 = 9; 
ws-icon-9 = 10; 󱄢
ws-icon-default = ""
format = <label-state> <label-mode>
label-focused = %{F#64727d}%{T4}%{T-}%{B#64727d}%{F#ffffff} %name%%{T2}%icon%%{T-} %{B-}%{F#64727d}%{T4}%{T-}%{F-}
label-visible = %{F#57626e}%{T4}%{T-}%{B#57626e}%{F#adb2b4} %name%%{T2}%icon%%{T-} %{B-}%{F#57626e}%{T4}%{T-}%{F-}
label-unfocused = %{F#4c5661}%{T4}%{T-}%{B#4c5661}%{F#99a1a5} %name%%{T2}%icon%%{T-} %{B-}%{F#4c5661}%{T4}%{T-}%{F-}
label-urgent = %{F#64727d}%{T4}%{T-}%{B#64727d}%{F#ff5252} %name%%{T2}%icon%%{T-} %{B-}%{F#64727d}%{T4}%{T-}%{F-}
label-mode = "  %mode% "
label-mode-background = #eb4d4b

[module/idle]
type = custom/script
tail = true
exec = exec $HOME/.local/bin/bar-status --every 120 idle '%{B#c77a69}%{F#2f343f}%{T4}%{T-}%{B#c77a69}%{F#000000}%{T2}%{T-}%{B#2f343f}%{F#c77a69}%{T4}%{T-}%{B- F-}' '%{B#445d67}%{F#2f343f}%{T4}%{T-}%{B#445d67}%{F#000000}%{T2}%{T-}%{B#2f343f}%{F#445d67}%{T4}%{T-}%{B- F-}'
click-left = $HOME/.local/bin/wm-idle toggle

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = %{B#597262}%{F#2f343f}%{T4}%{T-}%{B#597262}%{F#000000}%{T2}<ramp-volume>%{T-}%{B#4d504e}%{F#597262}%{T4}%{T-}%{B#4d504e}%{F#eef6eb}<label-volume>%{B#2f343f}%{F#4d504e}%{T4}%{T-}%{B- F-}
label-volume = %percentage%%
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
format-muted = %{B#597262}%{F#2f343f}%{T4}%{T-}%{B#597262}%{F#000000}%{T2}%{T-}%{B#4d504e}%{F#597262}%{T4}%{T-}%{B#4d504e}%{F#eef6eb}MUTE%{B#2f343f}%{F#4d504e}%{T4}%{T-}%{B- F-}
click-right = pavucontrol

[module/backlight]
type = internal/backlight
card = ${env:BAR_BACKLIGHT:intel_backlight}
use-actual-brightness = true
enable-scroll = true
format = %{B#597262}%{F#2f343f}%{T4}%{T-}%{B#597262}%{F#000000}%{T2}<ramp>%{T-}%{B#4d504e}%{F#597262}%{T4}%{T-}%{B#4d504e}%{F#eef6eb}<label>%{B#2f343f}%{F#4d504e}%{T4}%{T-}%{B- F-}
label = %percentage%%
ramp-0 = 
ramp-1 = 

[module/memory]
type = internal/memory
interval = 30
warn-percentage = 90
format = %{A1:alacritty -e htop:}%{B#445d67}%{F#2f343f}%{T4}%{T-}%{B#445d67}%{F#000000}%{T2}%{T-}%{B#3b4549}%{F#445d67}%{T4}%{T-}%{B#3b4549}%{F#eef6eb}<label>%{B#2f343f}%{F#3b4549}%{T4}%{T-}%{B- F-}%{A}
format-warn = %{A1:alacritty -e htop:}%{B#445d67}%{F#2f343f}%{T4}%{T-}%{B#445d67}%{F#000000}%{T2}%{T-}%{B#3b4549}%{F#445d67}%{T4}%{T-}%{B#3b4549}%{F#ff5252}<label-warn>%{B#2f343f}%{F#3b4549}%{T4}%{T-}%{B- F-}%{A}
label = %gb_free%
label-warn = %gb_free%

[module/disk]
type = internal/fs
interval = 300
warn-percentage = 90
mount-0 = ${env:BAR_DISK:/}
format-mounted = %{B#445d67}%{F#2f343f}%{T4}%{T-}%{B#445d67}%{F#000000}%{T2}%{T-}%{B#3b4549}%{F#445d67}%{T4}%{T-}%{B#3b4549}%{F#eef6eb}<label-mounted>%{B#2f343f}%{F#3b4549}%{T4}%{T-}%{B- F-}
format-warn = %{B#445d67}%{F#2f343f}%{T4}%{T-}%{B#445d67}%{F#000000}%{T2}%{T-}%{B#3b4549}%{F#445d67}%{T4}%{T-}%{B#3b4549}%{F#ff5252}<label-warn>%{B#2f343f}%{F#3b4549}%{T4}%{T-}%{B- F-}
label-mounted = %free%
label-warn = %free%
format-unmounted = ""

[module/power]
type = custom/script
tail = true
exec = exec $HOME/.local/bin/bar-status --every 60 power '%{B#c77a69}%{F#2f343f}%{T4}%{T-}%{B#c77a69}%{F#000000}%{T2}%{T-}%{B#2f343f}%{F#c77a69}%{T4}%{T-}%{B- F-}' '%{B#597262}%{F#2f343f}%{T4}%{T-}%{B#597262}%{F#000000}%{T2}%{T-}%{B#2f343f}%{F#597262}%{T4}%{T-}%{B- F-}' '%{B#597262}%{F#2f343f}%{T4}%{T-}%{B#597262}%{F#000000}%{T2}%{T-}%{B#2f343f}%{F#597262}%{T4}%{T-}%{B- F-}'
click-left = $HOME/.local/bin/bar-status power-next

[module/battery]
type = internal/battery
battery = ${env:BAR_BATTERY:BAT0}
adapter = ${env:BAR_ADAPTER:AC}
full-at = 99
low-at = 10
poll-interval = 30
format-discharging = %{B#597262}%{F#2f343f}%{T4}%{T-}%{B#597262}%{F#000000}%{T2}<ramp-capacity>%{T-}%{B#4d504e}%{F#597262}%{T4}%{T-}%{B#4d504e}%{F#eef6eb}<label-discharging>%{B#2f343f}%{F#4d504e}%{T4}%{T-}%{B- F-}
format-low = %{B#597262}%{F#2f343f}%{T4}%{T-}%{B#597262}%{F#000000}%{T2}<ramp-capacity>%{T-}%{B#4d504e}%{F#597262}%{T4}%{T-}%{B#4d504e}%{F#ff5252}<label-low>%{B#2f343f}%{F#4d504e}%{T4}%{T-}%{B- F-}
format-charging = %{B#597262}%{F#2f343f}%{T4}%{T-}%{B#597262}%{F#000000}%{T2}%{T-}%{B#4d504e}%{F#597262}%{T4}%{T-}%{B#4d504e}%{F#eef6eb}<label-charging>%{B#2f343f}%{F#4d504e}%{T4}%{T-}%{B- F-}
format-full = %{B#597262}%{F#2f343f}%{T4}%{T-}%{B#597262}%{F#000000}%{T2}%{T-}%{B#4d504e}%{F#597262}%{T4}%{T-}%{B#4d504e}%{F#eef6eb}<label-full>%{B#2f343f}%{F#4d504e}%{T4}%{T-}%{B- F-}
label-discharging = %percentage%%
label-low = %percentage%%
label-charging = %percentage%%
label-full = %percentage%%
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

[module/load]
type = custom/script
tail = true
exec = exec $HOME/.local/bin/bar-status --every 20 load '%{B#445d67}%{F#2f343f}%{T4}%{T-}%{B#445d67}%{F#000000}%{T2}%{T-}%{B#3b4549}%{F#445d67}%{T4}%{T-}%{B#3b4549}%{F#eef6eb}@LOAD@%{B#2f343f}%{F#3b4549}%{T4}%{T-}%{B- F-}' '%{B#445d67}%{F#2f343f}%{T4}%{T-}%{B#445d67}%{F#000000}%{T2}%{T-}%{B#3b4549}%{F#445d67}%{T4}%{T-}%{B#3b4549}%{F#ff5252}@LOAD@%{B#2f343f}%{F#3b4549}%{T4}%{T-}%{B- F-}'
click-left = alacritty -e htop

[module/language]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = %{B#8b8367}%{F#2f343f}%{T4}%{T-}%{B#8b8367}%{F#000000}%{T2}%{T-}%{B#626059}%{F#8b8367}%{T4}%{T-}%{B#626059}%{F#eef6eb} <label-layout> %{B#2f343f}%{F#626059}%{T4}%{T-}%{B- F-}
label-layout = %{T3}%icon%%{T-}
layout-icon-0 = us;🇺🇸
layout-icon-1 = gb;🇬🇧
layout-icon-2 = ru;🇷🇺
layout-icon-3 = ua;🇺🇦
layout-icon-4 = de;🇩🇪
layout-icon-5 = fr;🇫🇷
layout-icon-6 = es;🇪🇸
layout-icon-7 = it;🇮🇹
layout-icon-8 = pl;🇵🇱
layout-icon-9 = by;🇧🇾
layout-icon-default = %layout%
label-indicator-on = ""

[module/time]
type = internal/date
interval = 30
time = %H:%M
format = %{B#c77a69}%{F#2f343f}%{T4}%{T-}%{B#c77a69}%{F#000000}%{T2}%{T-}%{B#8e665d}%{F#c77a69}%{T4}%{T-}%{B#8e665d}%{F#eef6eb}<label>%{B#2f343f}%{F#8e665d}%{T4}%{T-}%{B- F-}
