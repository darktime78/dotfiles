[module/router]
type = custom/script
tail = true
exec = exec $HOME/.local/bin/bar-status --every 120 service router '%{B#c77a69}%{F#2f343f}%{T4}%{T-}%{B#c77a69}%{F#000000}%{T2}%{T-}%{B#8e665d}%{F#c77a69}%{T4}%{T-}%{B#8e665d}%{F#eef6eb}Router%{B#2f343f}%{F#8e665d}%{T4}%{T-}%{B- F-}' '%{B#445d67}%{F#2f343f}%{T4}%{T-}%{B#445d67}%{F#000000}%{T2}%{T-}%{B#3b4549}%{F#445d67}%{T4}%{T-}%{B#3b4549}%{F#9aa0a6}Router%{B#2f343f}%{F#3b4549}%{T4}%{T-}%{B- F-}'
click-left = $HOME/.local/bin/bar-service router toggle

[module/mpd]
type = internal/mpd
interval = 10
format-online = %{A5:mpc -q next:}%{A4:mpc -q prev:}%{B#597262}%{F#2f343f}%{T4}%{T-}%{B#597262}%{F#000000}%{T2}<toggle>%{T-}%{B#4d504e}%{F#597262}%{T4}%{T-}%{B#4d504e}%{F#eef6eb}<label-song>%{B#2f343f}%{F#4d504e}%{T4}%{T-}%{B- F-}%{A}%{A}
