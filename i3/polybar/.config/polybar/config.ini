[module/tray]
type = internal/tray
tray-size = 70%
tray-spacing = 6
tray-background = #2f343f

[module/fim]
type = custom/script
tail = true
exec = exec $HOME/.local/bin/bar-status --every 120 service fim '%{B#c77a69}%{F#2f343f}%{T4}%{T-}%{B#c77a69}%{F#000000}%{T2}%{T-}%{B#8e665d}%{F#c77a69}%{T4}%{T-}%{B#8e665d}%{F#eef6eb}FIM%{B#2f343f}%{F#8e665d}%{T4}%{T-}%{B- F-}' '%{B#445d67}%{F#2f343f}%{T4}%{T-}%{B#445d67}%{F#000000}%{T2}%{T-}%{B#3b4549}%{F#445d67}%{T4}%{T-}%{B#3b4549}%{F#9aa0a6}FIM%{B#2f343f}%{F#3b4549}%{T4}%{T-}%{B- F-}'
