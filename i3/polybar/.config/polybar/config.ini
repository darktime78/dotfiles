interval = 30
format-connected = %{A1:alacritty --class nmtui -e nmtui:}%{B#6e4555}%{F#2f343f}%{T4}%{T-}%{B#6e4555}%{F#000000}%{T2}%{T-}%{B#4e3c43}%{F#6e4555}%{T4}%{T-}%{B#4e3c43}%{F#eef6eb}%essid% - %local_ip%%{B#6e4555}%{F#4e3c43}%{T4}%{T-}%{B#6e4555}%{F#000000}%{T2}%{T-}%{B#4e3c43}%{F#6e4555}%{T4}%{T-}%{B#4e3c43}%{F#eef6eb}%signal%%%{B#2f343f}%{F#4e3c43}%{T4}%{T-}%{B- F-}%{A}
