# Touchpad on X11 (same as the sway "input type:touchpad" block):
# tap to click, ignore the touchpad while typing.
# install.sh copies it to /etc/X11/xorg.conf.d/
Section "InputClass"
    Identifier "touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "DisableWhileTyping" "on"
EndSection
