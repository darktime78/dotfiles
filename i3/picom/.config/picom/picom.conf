# picom: compositor for i3. Only what the look needs (transparent Alacritty,
# rounded notifications, no tearing). No shadows, fading or blur: they cost battery.

backend = "glx";
vsync = true;
# fullscreen games / videos bypass the compositor: no extra latency or power
unredir-if-possible = true;
use-damage = true;

shadow = false;
fading = false;

# dunst popups get the same rounded corners as mako on sway; nothing else is rounded
# (this form works on picom 9 to 12; Ubuntu 24.04 has 10)
corner-radius = 10;
rounded-corners-exclude = [ "class_g != 'Dunst'" ];
