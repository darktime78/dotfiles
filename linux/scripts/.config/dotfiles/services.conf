# Services with an on/off button on the bottom bar (bash syntax).
# Used by bar-service (waybar and polybar)
#
# For each service:
#   LABEL  text on the button
#   CHECK  command that succeeds (exit 0) when the service is running
#   START  command to start it
#   STOP   command to stop it
#
# These are the systemd user services of arch-local-ai.

declare -A LABEL CHECK START STOP

LABEL[fim]="FIM"
CHECK[fim]="systemctl --user is-active -q localai-fim.service"
START[fim]="systemctl --user start localai-fim.service"
STOP[fim]="systemctl --user stop localai-fim.service"

LABEL[router]="Router"
CHECK[router]="systemctl --user is-active -q localai-router.service"
START[router]="systemctl --user start localai-router.service localai-sock.service"
STOP[router]="systemctl --user stop localai-sock.service localai-router.service"
