<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Hack is the default monospace font (terminals, code, <pre> on web pages).
     To use Hack for ALL text (also sans-serif), copy the block and change
     "monospace" to "sans-serif". Apply with: fc-cache -f -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Hack</family>
      <family>Hack Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
