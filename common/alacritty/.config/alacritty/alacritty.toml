# Alacritty (Linux and macOS). Machine-specific settings (font size, macOS Option key)
# go in local.toml, written by install.sh and not in git.

[general]
import = ["~/.config/alacritty/local.toml"]

[window]
decorations = "None"
opacity = 0.8

[scrolling]
history = 0

[font]
size = 10.0

[font.normal]
# Nerd Font version of Hack: same letters, plus the icons Neovim and the shell use
family = "Hack Nerd Font"

[colors]
# If `true`, bold text is drawn using the bright color variants.
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#000000"

[colors.normal]
black   = "#2E3436"
red     = "#CC0000"
green   = "#4E9A06"
yellow  = "#C4A000"
blue    = "#3465A4"
magenta = "#75507B"
cyan    = "#06989A"
white   = "#D3D7CF"

[colors.bright]
black   = "#555753"
red     = "#EF2929"
green   = "#8AE234"
yellow  = "#FCE94F"
blue    = "#729FCF"
magenta = "#AD7FA8"
cyan    = "#34E2E2"
white   = "#EEEEEC"

[mouse]
hide_when_typing = true
